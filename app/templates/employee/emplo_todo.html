<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<body >
    <div class="flex flex-row ">
    <!-- left side  -->
    
    <section class=" " >
        <!-- sidebar section -->
        <div class="sidebar bg-cyan-500 w-64 h-full max-sm:w-14 ">
            <!-- desktop screen  -->
            <div class="btns mx-6 pt-10 pb-5 flex flex-col justify-between h-full max-sm:hidden ">
                <ul class="mt-6 space-y-4 ">

                    <!-- dashboard  -->
                    <li class="">
                        
                        <a href="{{ url_for('employee_dashbaord') }}" class="block hover:bg-cyan-600 p-2 rounded flex items-center gap-3 ">
                            <img class="size-6" src="./images/dashboard-interface.png" alt="">
                            <label class="text-[22px] text-white font-semibold">Dashboard</label>
                        </a>
                    </li>

                 
                    <!-- todo  -->
                    <li class="">
                        
                        <a href="{{ url_for('employee_todo') }}" class="block hover:bg-cyan-600 p-2 rounded flex items-center gap-3 ">
                            <img class="size-8" src="./images/todo.png" alt="">
                            <label class="text-[22px] text-white font-semibold">Todo</label></a>
                    </li>

                    <!-- feature  -->
                    <li class="">
                        <a href="{{ url_for('employee_feature') }}" class="block hover:bg-cyan-600 p-2 rounded flex items-center gap-3 ">
                            <img class="size-8" src="./images/feature.png" alt="">
                            <label class="text-[22px] text-white font-semibold">Features</label></a>
                    </li>

                    <!-- Issues  -->
                    <li class="">
                        
                        <a href="{{ url_for('employee_issue') }}" class="block hover:bg-cyan-600 p-2 rounded flex items-center gap-3 ">
                            <img class="size-8" src="./images/add-task.png" alt="">
                            <label class="text-[22px] text-white font-semibold">Issues</label></a>
                    </li>

                  
                    
                </ul>

                <li class="">
                        
                    <a href="{{ url_for('employee_profile') }}" class="block hover:bg-cyan-600 p-2 rounded flex items-center gap-3 ">
                       
                        <button class="mt-5 px-16 w-[100%] py-3 bg-white rounded hover:bg-gray-200  font-semibold text-md">Profile</button>
                </li>
            </div>

            <!-- mobile screen  -->
            <div class="btns relative mx-2 pt-10 pb-5 flex flex-col justify-between items-end h-full hidden max-sm:block">
                <ul class="mt-6 space-y-4 ">
                    <li class="">
                        <!-- dashboard -->
                        <a href="{{ url_for('employee_dashbaord') }}" class="block hover:bg-cyan-600 p-2 rounded flex items-center gap-3 ">
                            <img class="size-6" src="./images/dashboard-interface.png" alt="">
                            
                        </a>
                    </li>

                    

                    <!-- todo  -->
                    <li class="">
                        
                        <a href="{{ url_for('employee_todo') }}" class="block hover:bg-cyan-600 p-2 rounded flex items-center gap-3 ">
                            <img class="size-8" src="./images/todo.png" alt="">
                        </a>
                    </li>

                    <!-- feature  -->
                    <li class="">
                        
                        <a href="{{ url_for('employee_feature') }}" class="block hover:bg-cyan-600 p-2 rounded flex items-center gap-3 ">
                            <img class="size-8" src="./images/feature.png" alt="">
                        </a>
                    </li>
                    <!-- issues  -->
                    <li class="">
                        
                        <a href="{{ url_for('employee_issue') }}" class="block hover:bg-cyan-600 p-2 rounded flex items-center gap-3 ">
                            <img class="size-8" src="./images/add-task.png" alt="">
                        </a>
                    </li>

                 
                    
                </ul>
                <div class="absolute bottom-5  block hover:bg-cyan-600 p-2 rounded flex items-center gap-3">
                    <li class="">
                        
                        <a href="{{ url_for('employee_profile') }}" class="block hover:bg-cyan-600 p-2 rounded flex items-center gap-3 ">
                            <button class=" "><img class="size-7" src="./images/user.png" alt=""></button>
                        
                        </a>
                    </li>

                </div>
                
            </div>
        </div>
        
    </section>
                   
   
                   
   

     <section class="w-full mx-5 max-sm:max-w-[90%]  my-5">
        <h3 class="text-2xl font-semibold mb-5">Employee Todo</h3>
       
     

        <table>
            <tr>
                <th class="px-6">Task Id</th>
                <th class="px-6">Task Name</th>
                <th class="px-6">Task Status</th>
                <th class="px-6">Task Priority</th>
                <th class="px-6">Employe Name</th>
                <th>Actions</th>
            </tr>

            {% for todos in emp_todos %}
            <tr>
                    <td class="px-6"> {{ todos[0] }}</td>
                    <td class="px-6">{{ todos[1] }}</td>
                    <td class="px-6">{{ todos[2] }}</td>
                    <td class="px-6">{{ todos[3] }}</td>
                    <td class="px-6">{{ todos[4] }}</td>

                    <td>
                      
                           
                            <button
                            type="submit"
                            onclick="make_todo_sttaus(this)"
                            data-task_id = "{{ todos[0] }}"   
                           
                            
                            >make Complete</button>

                        </form>
                    </td>
            </tr>

            {% endfor %}
        </table>

           <!-- Pop-up form container for update issue -->
    <div id="todo_popup" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden">
        <div class="relative p-6 bg-white rounded-md shadow-lg max-w-lg w-full">
            <!-- Close icon -->
            <button onclick="make_todo_sttaus()" class="absolute top-2 right-2 bg-gray-400 p-2 rounded-full hover:bg-gray-800">
                <img class="size-3" src="./images/close.png" alt="">
            </button>
            
            <!-- Form  -->
            <form action="{{ url_for('employee_todo') }}" method="post" class="space-y-4 mt-5">
                <div class="grid grid-cols-2 gap-4">
                    
                  
                  
                    <!-- Status Dropdown -->
                    <div>
                        <select 
                        name="task_status"
                        
                            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500"
                        >
                            <option value="" disabled selected>Status</option>
                            <option value="Pending">Pending</option>
                            <option value="completed">Complete</option>
                        
                        </select>
                    </div>

                    <div>
                        <input hidden  type="text" name="task_id" id="task_id">
                    </div>



                 
                   
                </div>
                
               
           
               
                
                <!-- Submit Button -->
                <div class="text-center">
                    <button 
                    name="make_complete_task"
                        type="submit" 

                        class="w-full px-6 py-3 bg-cyan-500 text-white rounded-md hover:bg-cyan-600 font-semibold"
                    >
                        Make complete
                    </button>
                </div>
            </form>
        </div>
    </div>
    </section>
</div>







<script>
         function make_todo_sttaus() {
            const todo_popup = document.getElementById('todo_popup');
            todo_popup.classList.toggle('hidden');

            if (event) {


        const button = event.currentTarget;

        const make_complete_task_id = button.getAttribute('data-task_id');
     
       

        // Set the values in the popup input fields
        document.getElementById('task_id').value = make_complete_task_id;
      
    }
        }
</script>
</body>
</html>
