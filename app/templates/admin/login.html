<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div class="min-h-screen flex items-center justify-center bg-gray-100">
    <div class="relative  flex flex-col flex-col-reverse md:flex-row items-center bg-white p-6 rounded-lg shadow-md">
     
      <div class="">
         <!-- .............flash -->
         <!-- {% with messages = get_flashed_messages() %} {% if messages %}
         <div id="flash-message" class="flex justify-center items-center w-[200px] h-[50px] bg-red-500 text-white rounded-md">
 
           <ul>
             {% for message in messages %}
             <li>{{ message }}</li>
             {% endfor %}
           </ul>
         </div>
         {% endif %} {% endwith %} -->
      </div>
      <!-- Left side (Form) -->
      <div class="relative flex-1 w-full md:w-1/2 p-4">
        <h2 class="text-3xl font-bold mb-6 text-center">Login</h2>
        
        <form action="{{ url_for('login') }}" method="post">
          <div class="mb-4">
            <input
              type="email"
              name="email"
              placeholder="Email"
              class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400"
            />
          </div>
          <div class="mb-4">
            <input
              type="password"
              name="password"
              placeholder="Password"
              class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400"
            />
          </div>
          <div class="mb-6 flex justify-end">
            <label for="">Admin</label>
                <input type="checkbox" name="role" value="admin" id="">
          </div>
          <div class="flex justify-center">
            <button
              type="submit"
              class="w-full bg-cyan-500 text-white font-semibold py-2 rounded-md hover:bg-cyan-600 transition"
            >
              Login
            </button>
          </div>
        </form>
      </div>

      <!-- Right side (Image) -->
      <div class=" md:block md:w-1/2 flex justify-center p-4">
        <img src="{{ url_for('static', filename = ('./images/login.jpg')) }}" alt="Checkmark" class="w-72 h-72">
      </div>

      
    </div>
  </div>


  <script>
  
  </script>
</body>
</html>
